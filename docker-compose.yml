services:
  app:
    build: .
    ports:
      - "15111:80"
    env_file:
      - .env
    environment:
      - POST_HOST=${VITE_POST_HOST}
    depends_on:
      - sync-server
    restart: always
    networks:
      - app-network

  sync-server:
    build: ./sync-server
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:15111}
      - AUTH_BASE_URL=${VITE_POST_HOST}
    volumes:
      - ./sync-server/data:/app/data
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
