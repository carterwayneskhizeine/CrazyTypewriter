<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Power Mode Typer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'terminal-green': '#00ff00',
              'terminal-green-dim': '#00cc00',
              'terminal-dark': '#008800',
              'terminal-black': '#050505',
            }
          }
        }
      }
    </script>
    <style>
      /* System Default Fonts */
      body {
        background-color: #000000;
        color: #33ff33;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        overflow-x: hidden;
      }

      .font-mono {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      .font-terminal {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      /* CRT Screen Glow Effect */
      .crt-glow {
        text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00, 0 0 15px #00ff00, 0 0 20px #00ff00;
      }

      .crt-glow-subtle {
        text-shadow: 0 0 3px #00ff00, 0 0 6px #00ff00;
      }

      /* CRT Scanlines Effect */
      .crt-scanlines::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 2px
        );
      }

      /* CRT Screen Curvature Effect */
      .crt-curvature {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 99;
        background: radial-gradient(
          ellipse at center,
          transparent 0%,
          transparent 70%,
          rgba(0, 0, 0, 0.4) 100%
        );
      }

      /* Screen Flicker Effect */
      @keyframes flicker {
        0% { opacity: 0.97; }
        5% { opacity: 0.95; }
        10% { opacity: 0.9; }
        15% { opacity: 0.95; }
        20% { opacity: 0.99; }
        50% { opacity: 0.95; }
        55% { opacity: 0.9; }
        60% { opacity: 0.99; }
        100% { opacity: 0.97; }
      }

      .crt-flicker {
        animation: flicker 0.15s infinite;
      }

      /* Block Cursor for Textarea */
      .block-cursor {
        caret-color: #33ff33;
      }

      .block-cursor::selection {
        background-color: #33ff33;
        color: #000000;
      }

      /* ASCII Box Borders */
      .ascii-box {
        border: 2px solid #33ff33;
        box-shadow: 0 0 10px #33ff33, inset 0 0 5px rgba(51, 255, 51, 0.1);
      }

      .ascii-box-dim {
        border: 1px solid #008800;
        box-shadow: 0 0 5px #008800;
      }

      /* Terminal Button Style */
      .terminal-btn {
        background: transparent;
        border: 2px solid #33ff33;
        color: #33ff33;
        text-shadow: 0 0 5px #33ff33;
        transition: all 0.15s ease;
      }

      .terminal-btn:hover {
        background: #33ff33;
        color: #000000;
        text-shadow: none;
        box-shadow: 0 0 20px #33ff33;
      }

      /* Terminal Input/Range Style */
      .terminal-range {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        background: #008800;
        outline: none;
        box-shadow: 0 0 5px #00ff00;
      }

      .terminal-range::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        background: #33ff33;
        cursor: pointer;
        box-shadow: 0 0 10px #33ff00, 0 0 20px #33ff00;
      }

      .terminal-range::-moz-range-thumb {
        width: 16px;
        height: 16px;
        background: #33ff33;
        cursor: pointer;
        border: none;
        box-shadow: 0 0 10px #33ff00, 0 0 20px #33ff00;
      }

      /* Override text colors for terminal theme */
      .text-terminal {
        color: #33ff33 !important;
      }

      .text-terminal-dim {
        color: #00aa00 !important;
      }

      .bg-terminal {
        background-color: #000000 !important;
      }

      .border-terminal {
        border-color: #33ff33 !important;
      }

      /* Shake Animations */
      @keyframes shake-1 {
        0% { transform: translate(0, 0); }
        25% { transform: translate(-1px, 1px); }
        50% { transform: translate(1px, -1px); }
        75% { transform: translate(-1px, -1px); }
        100% { transform: translate(0, 0); }
      }
      
      @keyframes shake-2 {
        0% { transform: translate(0, 0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(2px, -2px); }
        60% { transform: translate(-2px, -2px); }
        80% { transform: translate(2px, 2px); }
        100% { transform: translate(0, 0); }
      }

      @keyframes shake-3 {
        0% { transform: translate(0, 0); }
        10% { transform: translate(-3px, -3px) rotate(-1deg); }
        20% { transform: translate(3px, 3px) rotate(1deg); }
        30% { transform: translate(-3px, 3px); }
        40% { transform: translate(3px, -3px); }
        50% { transform: translate(-3px, -3px); }
        60% { transform: translate(3px, 3px); }
        70% { transform: translate(-3px, 3px); }
        80% { transform: translate(3px, -3px); }
        90% { transform: translate(-3px, -3px); }
        100% { transform: translate(0, 0); }
      }

      .shake-level-1 { animation: shake-1 0.1s linear; }
      .shake-level-2 { animation: shake-2 0.1s linear; }
      .shake-level-3 { animation: shake-3 0.1s linear; }

      /* Retro Terminal Scrollbar - Webkit */
      .terminal-scrollbar::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }

      .terminal-scrollbar::-webkit-scrollbar-track {
        background: #050505;
        border: 1px solid #008800;
      }

      .terminal-scrollbar::-webkit-scrollbar-thumb {
        background: #00ff00;
        border: 2px solid #008800;
        box-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00;
      }

      .terminal-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #33ff33;
        box-shadow: 0 0 10px #00ff00, 0 0 15px #00ff00, 0 0 20px #00ff00;
      }

      .terminal-scrollbar::-webkit-scrollbar-corner {
        background: #050505;
      }

      /* Retro Terminal Scrollbar - Firefox */
      .terminal-scrollbar {
        scrollbar-width: auto;
        scrollbar-color: #00ff00 #050505;
      }

      .terminal-scrollbar::-moz-scrollbar-track {
        background: #050505;
        border: 1px solid #008800;
      }

      .terminal-scrollbar::-moz-scrollbar-thumb {
        background: #00ff00;
        border: 2px solid #008800;
        box-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00;
      }

      .terminal-scrollbar::-moz-scrollbar-thumb:hover {
        background: #33ff33;
      }

      /* Markdown Preview Styles */
      .markdown-preview {
        overflow-y: auto;
      }

      .markdown-preview h1 {
        font-size: 1.5em;
        font-weight: bold;
        margin: 0.5em 0;
        border-bottom: 1px solid #33ff33;
        padding-bottom: 0.3em;
        color: #33ff33;
      }

      .markdown-preview h2 {
        font-size: 1.25em;
        font-weight: bold;
        margin: 0.5em 0;
        border-bottom: 1px dashed #00aa00;
        padding-bottom: 0.2em;
        color: #33ff33;
      }

      .markdown-preview h3 {
        font-size: 1.1em;
        font-weight: bold;
        margin: 0.5em 0;
        color: #33ff33;
      }

      .markdown-preview p {
        margin: 0.5em 0;
        line-height: 1.6;
      }

      .markdown-preview ul, .markdown-preview ol {
        margin: 0.5em 0;
        padding-left: 1.5em;
      }

      .markdown-preview li {
        margin: 0.25em 0;
      }

      .markdown-preview code {
        background-color: #001a00;
        padding: 0.1em 0.3em;
        border-radius: 3px;
        font-family: monospace;
        color: #aaffaa;
        border: 1px solid #008800;
      }

      .markdown-preview pre {
        background-color: #001a00;
        border: 1px solid #008800;
        padding: 1em;
        margin: 0.5em 0;
        overflow-x: auto;
        border-radius: 5px;
      }

      .markdown-preview pre code {
        background: none;
        padding: 0;
        border: none;
      }

      .markdown-preview blockquote {
        border-left: 3px solid #33ff33;
        margin: 0.5em 0;
        padding-left: 1em;
        color: #00cc00;
      }

      .markdown-preview a {
        color: #aaffaa;
        text-decoration: underline;
      }

      .markdown-preview a:hover {
        color: #ffffff;
        text-shadow: 0 0 10px #00ff00;
      }

      .markdown-preview hr {
        border: none;
        border-top: 1px dashed #008800;
        margin: 1em 0;
      }

      .markdown-preview table {
        border-collapse: collapse;
        width: 100%;
        margin: 0.5em 0;
      }

      .markdown-preview th, .markdown-preview td {
        border: 1px solid #008800;
        padding: 0.5em;
      }

      .markdown-preview th {
        background-color: #001a00;
        font-weight: bold;
      }

      /* ========== VS CODE THEME STYLES ========== */

      /* VS Code Cursor - Modern thin line cursor */
      .vscode-cursor {
        caret-color: #d4d4d4;
        width: 2px;
      }

      .vscode-cursor::selection {
        background-color: #007acc;
        color: #ffffff;
      }

      /* VS Code Box Border - Modern rounded with subtle shadow */
      .vscode-box {
        border: 1px solid #3c3c3c;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      /* VS Code Button Style - Modern rounded with hover effects */
      .vscode-btn {
        background: transparent;
        border: 1px solid transparent;
        color: #858585;
        border-radius: 4px;
        transition: all 0.2s ease;
      }

      .vscode-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #d4d4d4;
      }

      .vscode-btn:active {
        background: rgba(255, 255, 255, 0.15);
        transform: scale(0.98);
      }

      /* VS Code Range Input - Modern slider */
      .vscode-range {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        background: #3c3c3c;
        outline: none;
        border-radius: 2px;
      }

      .vscode-range::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        background: #007acc;
        cursor: pointer;
        border-radius: 50%;
        border: 2px solid #3c3c3c;
        transition: all 0.2s ease;
      }

      .vscode-range::-webkit-slider-thumb:hover {
        background: #1a9fff;
        transform: scale(1.1);
      }

      .vscode-range::-moz-range-thumb {
        width: 14px;
        height: 14px;
        background: #007acc;
        cursor: pointer;
        border-radius: 50%;
        border: 2px solid #3c3c3c;
        transition: all 0.2s ease;
      }

      .vscode-range::-moz-range-thumb:hover {
        background: #1a9fff;
        transform: scale(1.1);
      }

      /* VS Code Scrollbar - Modern and subtle */
      .vscode-scrollbar::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      .vscode-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }

      .vscode-scrollbar::-webkit-scrollbar-thumb {
        background: #424242;
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: content-box;
      }

      .vscode-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #555555;
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: content-box;
      }

      .vscode-scrollbar::-webkit-scrollbar-corner {
        background: transparent;
      }

      .vscode-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #424242 transparent;
      }

      .vscode-scrollbar::-moz-scrollbar-thumb {
        background: #424242;
        border-radius: 5px;
      }

      /* VS Code Markdown Preview Styles */
      .vscode-markdown-preview {
        overflow-y: auto;
      }

      .vscode-markdown-preview h1 {
        font-size: 1.5em;
        font-weight: 600;
        margin: 0.75em 0;
        border-bottom: 1px solid #3c3c3c;
        padding-bottom: 0.3em;
        color: #d4d4d4;
      }

      .vscode-markdown-preview h2 {
        font-size: 1.25em;
        font-weight: 600;
        margin: 0.75em 0;
        border-bottom: 1px solid #3c3c3c;
        padding-bottom: 0.2em;
        color: #d4d4d4;
      }

      .vscode-markdown-preview h3 {
        font-size: 1.1em;
        font-weight: 600;
        margin: 0.75em 0;
        color: #d4d4d4;
      }

      .vscode-markdown-preview p {
        margin: 0.5em 0;
        line-height: 1.6;
        color: #d4d4d4;
      }

      .vscode-markdown-preview ul, .vscode-markdown-preview ol {
        margin: 0.5em 0;
        padding-left: 1.5em;
        color: #d4d4d4;
      }

      .vscode-markdown-preview li {
        margin: 0.25em 0;
      }

      .vscode-markdown-preview code {
        background-color: #2d2d2d;
        padding: 0.1em 0.4em;
        border-radius: 3px;
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        color: #d4d4d4;
        font-size: 0.9em;
      }

      .vscode-markdown-preview pre {
        background-color: #1e1e1e;
        border: 1px solid #3c3c3c;
        border-radius: 4px;
        padding: 1em;
        margin: 0.75em 0;
        overflow-x: auto;
      }

      .vscode-markdown-preview pre code {
        background: none;
        padding: 0;
        border: none;
      }

      .vscode-markdown-preview blockquote {
        border-left: 4px solid #007acc;
        margin: 0.5em 0;
        padding-left: 1em;
        color: #9cdcfe;
        background-color: rgba(0, 122, 204, 0.05);
        border-radius: 0 4px 4px 0;
        padding: 0.5em 1em;
      }

      .vscode-markdown-preview a {
        color: #3794ff;
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: all 0.2s ease;
      }

      .vscode-markdown-preview a:hover {
        color: #1a9fff;
        border-bottom-color: #1a9fff;
      }

      .vscode-markdown-preview hr {
        border: none;
        border-top: 1px solid #3c3c3c;
        margin: 1.5em 0;
      }

      .vscode-markdown-preview table {
        border-collapse: collapse;
        width: 100%;
        margin: 0.75em 0;
        border: 1px solid #3c3c3c;
        border-radius: 4px;
        overflow: hidden;
      }

      .vscode-markdown-preview th, .vscode-markdown-preview td {
        border: 1px solid #3c3c3c;
        padding: 0.5em;
        text-align: left;
      }

      .vscode-markdown-preview th {
        background-color: #252526;
        font-weight: 600;
        color: #d4d4d4;
      }

      .vscode-markdown-preview tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.02);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
