<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Power Mode Typer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap');
      
      body {
        background-color: #0f172a;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Shake Animations */
      @keyframes shake-1 {
        0% { transform: translate(0, 0); }
        25% { transform: translate(-1px, 1px); }
        50% { transform: translate(1px, -1px); }
        75% { transform: translate(-1px, -1px); }
        100% { transform: translate(0, 0); }
      }
      
      @keyframes shake-2 {
        0% { transform: translate(0, 0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(2px, -2px); }
        60% { transform: translate(-2px, -2px); }
        80% { transform: translate(2px, 2px); }
        100% { transform: translate(0, 0); }
      }

      @keyframes shake-3 {
        0% { transform: translate(0, 0); }
        10% { transform: translate(-3px, -3px) rotate(-1deg); }
        20% { transform: translate(3px, 3px) rotate(1deg); }
        30% { transform: translate(-3px, 3px); }
        40% { transform: translate(3px, -3px); }
        50% { transform: translate(-3px, -3px); }
        60% { transform: translate(3px, 3px); }
        70% { transform: translate(-3px, 3px); }
        80% { transform: translate(3px, -3px); }
        90% { transform: translate(-3px, -3px); }
        100% { transform: translate(0, 0); }
      }

      .shake-level-1 { animation: shake-1 0.1s linear; }
      .shake-level-2 { animation: shake-2 0.1s linear; }
      .shake-level-3 { animation: shake-3 0.1s linear; }
      
      /* Progress Bar Animation */
      .combo-bar-drain {
        transition: width 0.1s linear;
      }
    </style>

{

    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
